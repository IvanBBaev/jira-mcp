# Release publishing — LIVE. It published 0.9.0 (2026-08-17) and 0.9.4
# (2026-08-18); docs/RELEASING.md is the runbook and carries the observed state
# of every repository setting named below.
#
# O-9 (publish to npm) and O-10 (public repository) are resolved in
# docs/DECISIONS.md. What stands between a commit and the registry is now these
# guards, all of which must hold for a single byte to be published:
#
#   1. The repository variable `PUBLISH_ENABLED` is the string `true` (Settings >
#      Secrets and variables > Actions > Variables). It has been set since
#      2026-08-17, so it is a standing go signal, not a pending one; unsetting
#      it is the fastest way to stop releases without touching a file — the job
#      is then skipped outright.
#   2. A tag matching `v*` is pushed. Nothing else publishes: a manual
#      `workflow_dispatch` run is a rehearsal that stops before `npm publish`.
#   3. The full gate (`npm run check`), the tarball assertion and the
#      tag-equals-package.json-version check all pass on the runner first.
#   4. A publishing credential exists: the bootstrap `NPM_TOKEN` secret today,
#      the npm trusted publisher (OIDC) once it is registered — see below.
#
# The `release` environment is declared on the job; it has no required reviewer
# today, and adding one is the single settings edit that puts a human in front
# of every release. The registry itself is the last guard: it rejects a
# re-publish of a version that already exists.
#
# The steady state is trusted publishing: GitHub OIDC and nothing else, npm CLI
# >= 11.5.1 (hence the Node 24 runner and the explicit assertion below), and
# `id-token: write` on the publishing job. It is not reachable for a package that
# does not exist yet: a trusted publisher is configured on a package's settings
# page on npmjs.com, and there is no settings page until something has been
# published. So the first release was published with a granular access token
# in the `NPM_TOKEN` secret (D86). The package exists now, but the trusted
# publisher is still NOT registered, so releases (0.9.4 included) keep going out
# on that token until the retirement in docs/RELEASING.md §5 is done.
#
# The publish step below reads that secret if it is present and uses OIDC if it
# is not, which makes the transition an act of deletion rather than an edit:
# register the trusted publisher, delete the secret (and revoke the token on
# npmjs.com), and this file is token-free again without a diff. Deletion is the point —
# granular tokens cap at 90 days, so a token kept past its one job is a chore
# that also sits in the repo as a stealable long-lived credential.
#
# Two notes for whoever registers the trusted publisher (for repository and for
# THIS workflow filename — `publish.yml`, extension included, case-sensitive):
#   - Configurations created after 2026-05-20 must explicitly select at least one
#     allowed action; pick `npm publish`.
#   - Provenance requires a PUBLIC repository and a public package. The repo is
#     public, so `--provenance` is viable; if visibility ever flips back to
#     private, the flag failing is the correct outcome, not a bug to work
#     around by dropping it.

name: Publish

on:
  push:
    tags: ['v*']
  # Rehearsal only. This path runs the gate and the tarball assertion and then
  # stops: the publish step is guarded on the tag event, so a manual run cannot
  # reach the registry however it is invoked.
  workflow_dispatch:

# Read-only at the top. The publishing job widens this for itself, and only to
# `id-token: write` — the OIDC claim, not a write token for anything in the repo.
permissions:
  contents: read

# A publish is not repeatable: the registry rejects a re-publish of the same
# version. Two runs racing to the same tag must not both reach `npm publish`.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same determinism knobs as ci.yml (docs/TESTING.md §Determinism knobs) — the
  # gate runs here too, and it must reach the same verdict it reached in CI.
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    # Guard 1. `vars.PUBLISH_ENABLED` has been `true` since O-9 was resolved
    # (2026-08-17). Unset it to make this job skip and the workflow a no-op.
    if: vars.PUBLISH_ENABLED == 'true'
    # Give this a required reviewer in Settings > Environments if you want a
    # human approval step in front of every release as well.
    environment: release
    permissions:
      contents: read
      # OIDC claim. Trusted publishing needs it; so does `--provenance` under
      # the bootstrap token, which is why it stays on either way.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 is the release runner because trusted publishing needs
          # npm >= 11.5.1, which Node 22 does not ship. The package itself still
          # supports Node >= 22 — that floor is `engines`, tested in ci.yml.
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      # An npm too old to exchange the OIDC claim would fail in the publish
      # step's error output at the worst moment, or — once the bootstrap token
      # is gone — look like a credential problem. Assert the version up front.
      - name: Assert npm supports trusted publishing
        run: |
          version="$(npm --version)"
          echo "npm $version"
          node -e '
            const [have] = process.argv.slice(1);
            const need = "11.5.1";
            const cmp = (a, b) =>
              a.split(".").map(Number).reduce((r, n, i) => r || n - Number(b.split(".")[i]), 0);
            if (cmp(have, need) < 0) {
              console.error(`npm ${have} is older than ${need}, which trusted publishing requires.`);
              process.exit(1);
            }
          ' "$version"

      - run: npm ci

      # The full gate, before anything irreversible — including the advisory
      # audit, which lives here rather than in `prepublishOnly` (D62) so a
      # newly disclosed CVE stops the release *before* the tag is consumed
      # instead of half way through `npm publish`. `prepublishOnly` re-runs
      # everything except that audit; the duplication is deliberate — it is what
      # protects a hand-run `npm publish` from a laptop, where this workflow is
      # not involved at all.
      - run: npm run check

      # `npm pack` reads build/ off disk rather than compiling, so this has to
      # follow the gate (which builds), not precede it.
      - name: Assert tarball contents
        run: node scripts/check-tarball.mjs

      # A tag that disagrees with package.json means somebody tagged the wrong
      # commit. Catching it here costs a second; catching it after publish costs
      # a version number, because the registry never lets one be reused.
      - name: Assert the tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p 'require("./package.json").version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME says $tag but package.json says $pkg." >&2
            exit 1
          fi
          echo "Publishing $pkg from tag $GITHUB_REF_NAME"

      # Guard 2. Only a pushed `v*` tag gets here. `--provenance` is redundant
      # with current npm, which attests automatically under trusted publishing,
      # and is required to get an attestation at all under the bootstrap token —
      # so it is explicit in both worlds, and the day the default changes this
      # line is what says the signed link back to the workflow run and commit was
      # asked for on purpose, not inherited.
      #
      # Which credential is used is decided by whether the secret exists, not by
      # an edit here (see the header). Actions masks secrets in logs; the token
      # is written to the runner's own npm config, never to a file in the repo.
      - name: Publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "::notice::Bootstrap publish using the NPM_TOKEN secret. Delete it once a trusted publisher is registered for this package."
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          else
            echo "::notice::Trusted publishing: no NPM_TOKEN secret, so npm exchanges the GitHub OIDC claim."
          fi
          npm publish --provenance --access public

      - name: Rehearsal summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::notice::Rehearsal complete — gate and tarball assertion passed. Push a v* tag to publish."
