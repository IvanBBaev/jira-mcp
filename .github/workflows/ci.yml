name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The live read suite is scheduled, never triggered by a PR: it needs repo
  # secrets, and a fork PR must never be able to reach them. Mondays 04:17 UTC —
  # an odd minute, because on-the-hour cron slots are the congested ones.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless.
# Keyed per-ref, and never cancelling on main so the default branch keeps a
# complete history of green/red.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default. The `check` job touches no secret at all: the unit
# suite runs behind the network fence against synthetic fixtures, never a real
# Jira site.
permissions:
  contents: read

env:
  # Determinism knobs (docs/TESTING.md §Determinism knobs): a machine-local
  # timezone or locale must never decide whether an assertion passes.
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # `check:publish` is `npm run check` minus the advisory audit, which runs
      # in the `audit` job below: a new advisory is a separate red line, not a
      # failed build on every Node of the matrix (D546).
      - run: npm run check:publish

  # The advisory audit on its own (D546): `scripts/audit-gate.mjs` runs
  # `npm audit --omit=dev` and fails only on a high or critical advisory that
  # `audit-allowlist.json` does not cover, or on an allowlist entry that has
  # expired. Its verdict depends on the advisory database at the second it runs,
  # not on the commit, which is why it is a named job of its own. `publish.yml`
  # still runs the full `npm run check`, so the same gate guards the release.
  audit:
    name: audit
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      # No `npm ci`: `npm audit` reads package-lock.json, and the gate script
      # imports nothing but node builtins.
      - run: npm run audit:prod

  # Since D36 `check` already runs the suite under c8 (`test:coverage` is step 6
  # of `check:publish`, docs/TESTING.md §Gate), so this job repeats that run on
  # the newest Node under its own status name. It proves nothing the matrix does
  # not; it is kept only as a separately named line in the checks list.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run coverage

  # The Claude Desktop bundle (D521), built the way a release would build it:
  # the publish build, the tarball assertion on it, then `npm pack` and the
  # bundle from that same tarball. The `.mcpb` and its sha256 are kept as a
  # workflow artifact; attaching them to a GitHub Release is a release step,
  # not this job's. `npm ci` inside the script needs the registry, which is why
  # this lives here and not in `npm run check`.
  mcpb:
    name: mcpb bundle
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build:publish
      - run: npm run tarball:publish
      - name: Pack the tarball and the bundle from it
        run: |
          tarball="$(npm pack --json --pack-destination "$RUNNER_TEMP" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')"
          npm run mcpb -- --tarball "$RUNNER_TEMP/$tarball" --out mcpb/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: mcpb/dist/
          if-no-files-found: error

  # The consumer's install, not the lockfile's (V3-75): the publish build,
  # packed, installed into an empty directory with no lockfile, then the
  # installed `jira-mcp-ai` binary must answer MCP `initialize` and `tools/list`
  # over stdio with the package version and every tool of the manifest
  # (`scripts/smoke-pack.mjs`). `resolved` takes whatever the dependency ranges
  # give on the day, so a breaking SDK minor turns this red before a user meets
  # it; `lower-bound` pins `@modelcontextprotocol/sdk` to the floor of the range
  # `package.json` declares, the only test of that promise. `npm install` needs
  # the registry, which is why this lives here and not in `npm run check`.
  smoke:
    name: tarball smoke (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        sdk: [resolved, lower-bound]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build:publish
      - run: npm run tarball:publish
      - name: Pack, install clean and handshake
        run: |
          tarball="$(npm pack --json --pack-destination "$RUNNER_TEMP" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')"
          if [ "${{ matrix.sdk }}" = lower-bound ]; then set -- --lower-bound; else set --; fi
          node scripts/smoke-pack.mjs --tarball "$RUNNER_TEMP/$tarball" "$@"

  # Suite 9 (docs/TESTING.md): the read-only half of Gate C against the scratch
  # site, asking the one question fixtures cannot — has Atlassian changed the
  # wire? It runs `scripts/verify-live.mjs` WITHOUT --write/--irreversible/
  # --purge, so it drives the BUILT server over stdio exactly as a client would:
  # doctor preflight, read claims, residue inventory. Every child it spawns is
  # pinned to JIRA_WRITE_MODE=plan by the driver itself, and nothing destructive
  # can start without --confirm-site, which this job never passes. Exit 1 on any
  # FAIL claim, so a changed wire is a red scheduled run.
  #
  # It is NOT `npm test`: no unit test talks to Jira, and running the unit suite
  # with JIRA_LIVE_TEST=1 only switched its network fence off while the real
  # secrets sat in the environment — proving nothing about the site.
  #
  # Weekly, on the default branch only. Every gate below has to hold:
  #   - schedule/manual only, so no PR (least of all a fork's) can reach it;
  #   - the `live` environment, where the JIRA_* secrets are scoped;
  #   - JIRA_API_TOKEN actually present, so a fresh clone of this repo without
  #     secrets reports "skipped", not a red build nobody can fix.
  # Optional repository variables JIRA_LIVE_PROJECT / JIRA_LIVE_PROJECT2 name the
  # scratch projects (--project / --project2); unset, the project-scoped claims
  # SKIP and the residue table reports those classes UNKNOWN.
  live:
    name: live read suite
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    environment: live
    # Job-level, not step-level: a step's own `env:` is not visible to that
    # step's `if:`, so the presence check below would always read empty. The
    # driver hands the credentials to its child servers explicitly and never
    # lets them inherit anything else from this environment.
    env:
      JIRA_SITE: ${{ secrets.JIRA_SITE }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_LIVE_PROJECT: ${{ vars.JIRA_LIVE_PROJECT }}
      JIRA_LIVE_PROJECT2: ${{ vars.JIRA_LIVE_PROJECT2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # The driver spawns build/index.js; it refuses to run (exit 2) without it.
      - run: npm run build
      - name: Run live read suite
        if: env.JIRA_API_TOKEN != ''
        run: |
          set --
          if [ -n "$JIRA_LIVE_PROJECT" ]; then set -- "$@" --project "$JIRA_LIVE_PROJECT"; fi
          if [ -n "$JIRA_LIVE_PROJECT2" ]; then set -- "$@" --project2 "$JIRA_LIVE_PROJECT2"; fi
          node scripts/verify-live.mjs "$@"
      - name: Report missing credentials
        if: env.JIRA_API_TOKEN == ''
        run: echo "::notice::Live suite skipped — the JIRA_* secrets are not configured."
