name: Docker

# Builds the container image (D520) and proves it starts. It never pushes:
# publishing to ghcr.io is a distribution step (roadmap V3-23), and this
# workflow has neither `packages: write` nor a registry login on purpose.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The release shape: both platforms, with an SBOM and a provenance
  # attestation, exported to an OCI layout on the runner. The export is what
  # makes the attestations real; the check below fails the job if either is
  # missing from the index.
  build:
    name: build (amd64 + arm64, SBOM, provenance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          sbom: true
          provenance: mode=max
          outputs: type=oci,dest=${{ runner.temp }}/image.oci.tar
      - name: Assert both platforms and their attestations are in the index
        run: |
          dir="$RUNNER_TEMP/oci"
          mkdir -p "$dir"
          tar -xf "$RUNNER_TEMP/image.oci.tar" -C "$dir"
          top="$(jq -r '.manifests[0].digest' "$dir/index.json" | sed 's/:/\//')"
          index="$dir/blobs/$top"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | contains(["amd64", "arm64"])' "$index"
          jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length >= 2' "$index"
          for att in $(jq -r '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest | sub(":"; "/")' "$index"); do
            jq -e '[.layers[].annotations["in-toto.io/predicate-type"]] | (any(startswith("https://spdx.dev/"))) and (any(startswith("https://slsa.dev/provenance/")))' "$dir/blobs/$att"
          done

  # The image as a user runs it: built for the runner's platform, loaded into
  # the local daemon and started over stdio. Synthetic credentials only; the
  # server never reaches Jira for `initialize` and `tools/list`.
  smoke:
    name: smoke (stdio, non-root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: jira-mcp-ai:ci
      - name: Version matches package.json
        run: |
          want="$(jq -r .version package.json)"
          got="$(docker run --rm jira-mcp-ai:ci --version)"
          echo "image $got, package.json $want"
          test "$got" = "$want"
      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id jira-mcp-ai:ci -u)" != "0"
      - name: Answers initialize and tools/list over stdio
        run: |
          out="$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm \
                -e JIRA_SITE=https://example.atlassian.net \
                -e JIRA_EMAIL=ci@example.com \
                -e JIRA_API_TOKEN=synthetic \
                jira-mcp-ai:ci)"
          printf '%s\n' "$out" | jq -e 'select(.id == 2) | .result.tools | length > 0'
